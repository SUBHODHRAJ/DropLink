version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: droplink-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: droplink_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - droplink-network

  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: droplink-api
    restart: always
    depends_on:
      - mysql
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=droplink_db;User=root;Password=rootpassword123;CharSet=utf8mb4;
      - StorageSettings__LocalStoragePath=/app/storage/local
      - StorageSettings__TempStoragePath=/app/storage/temporary
      - StorageSettings__PublicDomain=https://droplink.yourdomain.com
    ports:
      - "5000:5000"
    volumes:
      - storage_data:/app/storage
    networks:
      - droplink-network

networks:
  droplink-network:
    driver: bridge

volumes:
  mysql_data:
  storage_data:
